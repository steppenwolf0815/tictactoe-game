<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .status {
            font-size: 1.2em;
            margin-bottom: 20px;
            color: #667eea;
            font-weight: bold;
            height: 30px;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-gap: 5px;
            margin-bottom: 20px;
            background: #667eea;
            padding: 5px;
            border-radius: 5px;
        }

        .cell {
            width: 100px;
            height: 100px;
            background: white;
            border: none;
            font-size: 2em;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            color: #667eea;
        }

        .cell:hover {
            background: #f0f0f0;
            transform: scale(1.05);
        }

        .cell.x {
            color: #e74c3c;
        }

        .cell.o {
            color: #3498db;
        }

        .cell:disabled {
            cursor: not-allowed;
        }

        .reset-btn {
            padding: 12px 30px;
            font-size: 1.1em;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .reset-btn:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        .reset-btn:active {
            transform: scale(0.95);
        }

        .score {
            margin-top: 20px;
            font-size: 1.1em;
            color: #333;
        }

        .score-display {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
            gap: 20px;
        }

        .score-item {
            flex: 1;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 5px;
        }

        .score-item span {
            font-weight: bold;
            color: #667eea;
            font-size: 1.5em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>
        <div class="status" id="status">Player X's Turn</div>
        
        <div class="game-board" id="gameBoard">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>

        <button class="reset-btn" id="resetBtn">Reset Game</button>

        <div class="score">
            <div>Score</div>
            <div class="score-display">
                <div class="score-item">
                    X Wins: <span id="xScore">0</span>
                </div>
                <div class="score-item">
                    Draws: <span id="drawScore">0</span>
                </div>
                <div class="score-item">
                    O Wins: <span id="oScore">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const gameBoard = document.getElementById('gameBoard');
        const statusDisplay = document.getElementById('status');
        const resetBtn = document.getElementById('resetBtn');
        const cells = document.querySelectorAll('.cell');
        
        let currentPlayer = 'X';
        let gameActive = true;
        let boardState = ['', '', '', '', '', '', '', '', ''];
        let xWins = 0;
        let oWins = 0;
        let draws = 0;

        const winningConditions = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        function checkWinner() {
            for (let condition of winningConditions) {
                const [a, b, c] = condition;
                if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                    return boardState[a];
                }
            }
            return null;
        }

        function checkDraw() {
            return boardState.every(cell => cell !== '');
        }

        function updateStatus() {
            const winner = checkWinner();
            
            if (winner) {
                statusDisplay.textContent = `Player ${winner} Wins! 🎉`;
                gameActive = false;
                if (winner === 'X') {
                    xWins++;
                    document.getElementById('xScore').textContent = xWins;
                } else {
                    oWins++;
                    document.getElementById('oScore').textContent = oWins;
                }
            } else if (checkDraw()) {
                statusDisplay.textContent = "It's a Draw! 🤝";
                gameActive = false;
                draws++;
                document.getElementById('drawScore').textContent = draws;
            } else {
                statusDisplay.textContent = `Player ${currentPlayer}'s Turn`;
            }
        }

        function handleCellClick(e) {
            const cell = e.target;
            const index = cell.getAttribute('data-index');

            if (boardState[index] !== '' || !gameActive) {
                return;
            }

            boardState[index] = currentPlayer;
            cell.textContent = currentPlayer;
            cell.classList.add(currentPlayer.toLowerCase());

            updateStatus();

            if (gameActive) {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            }
        }

        function resetGame() {
            currentPlayer = 'X';
            gameActive = true;
            boardState = ['', '', '', '', '', '', '', '', ''];
            statusDisplay.textContent = "Player X's Turn";

            cells.forEach(cell => {
                cell.textContent = '';
                cell.classList.remove('x', 'o');
            });
        }

        cells.forEach(cell => {
            cell.addEventListener('click', handleCellClick);
        });

        resetBtn.addEventListener('click', resetGame);

        updateStatus();
    </script>
</body>
</html>
